services:
  postgres:
    image: postgres:16-alpine
    container_name: service_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: service_platform
      POSTGRES_PASSWORD: service_platform
      POSTGRES_DB: service_platform
    ports:
      - "5433:5432"
    volumes:
      - service_platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U service_platform -d service_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: service_platform_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://service_platform:service_platform@postgres:5432/service_platform
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api:/app
      - ./scripts:/scripts:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: service_platform_web
    restart: unless-stopped
    ports:
      - "5173:8080"
    depends_on:
      - api

volumes:
  service_platform_postgres_data:
