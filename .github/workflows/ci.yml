# Continuous integration for backend (Docker Compose) and frontend (Vitest/build).
# Playwright browser E2E is intentionally local/manual — see README_FRONTEND.md.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Start Docker Compose services
        run: docker compose up -d --build postgres api

      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose logs api
          exit 1

      - name: Run migrations
        run: docker compose exec -T api alembic upgrade head

      - name: Run pytest
        run: docker compose exec -T api python -m pytest

      - name: Run check_backend.py
        run: docker compose exec -T api python scripts/check_backend.py

      - name: Seed demo data
        run: docker compose exec -T api python scripts/seed_demo.py

      - name: Run E2E backend audit
        run: docker compose exec -T api python scripts/e2e_backend_audit.py

      - name: Show API logs on failure
        if: failure()
        run: docker compose logs api

      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend-tests:
    name: frontend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest smoke tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Route smoke check
        run: npm run check:routes

      - name: Verify production Docker image builds
        run: docker compose -f ../docker-compose.yml build web

      - name: Validate production compose file
        run: |
          cp ../.env.example ../.env
          docker compose -f ../docker-compose.prod.yml config
          docker compose -p service_platform_prod -f ../docker-compose.prod.yml build

      # TODO: Optional Playwright job (disabled) — requires Docker backend, seed_demo.py,
      # and `npx playwright install chromium`. Run locally:
      #   docker compose up -d --build
      #   docker compose exec api python scripts/seed_demo.py
      #   cd web && npm run test:e2e
