# Minimal Gitleaks config — skip build/cache paths only (not source or env files).
# Do not allowlist .env or broad secret patterns.
# Exact historical finding fingerprints live in .gitleaksignore (preferred for
# full-history scans). Path+regex allowlists below are defense-in-depth for the
# same documented test/doc placeholders only.

title = "service_platform_pwa gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Build/cache paths"
paths = [
  '''(?:^|/)node_modules/''',
  '''(?:^|/)web/node_modules/''',
  '''(?:^|/)web/dist/''',
  '''(?:^|/)\.pytest_cache/''',
  '''(?:^|/)__pycache__/''',
  '''(?:^|/)postgres_data/''',
  '''(?:^|/)logs/''',
  '''(?:^|/)backups/''',
  '''(?:^|/)web/playwright-report/''',
  '''(?:^|/)web/test-results/''',
  '''(?:^|/)\.venv/''',
]

# README_BACKEND.md historically used literal Bearer CLIENT_TOKEN / SUPERADMIN_TOKEN
# in curl examples (not live credentials). Current tree removed Authorization headers.
# Prefer .gitleaksignore fingerprints for history; keep narrow regex for working tree.
[[allowlists]]
description = "README_BACKEND.md historical curl Bearer doc placeholders only"
paths = [
  '''(?:^|/)README_BACKEND\.md$''',
]
regexes = [
  '''^CLIENT_TOKEN$''',
  '''^SUPERADMIN_TOKEN$''',
]

# Pre-placeholder-hardening unit fixtures used a fixed hex JWT string.
# Current tests use test-jwt-placeholder-thirty-two-characters-min instead.
[[allowlists]]
description = "Production env/security test historical hex JWT fixtures only"
paths = [
  '''(?:^|/)api/tests/test_production_env_script\.py$''',
  '''(?:^|/)api/tests/test_production_security\.py$''',
]
regexes = [
  '''^0123456789abcdef0123456789abcdef0123456789ab$''',
]

# STRIPE_TEST_MODE_RUNBOOK.md briefly used sk_test_placeholder before
# <STRIPE_TEST_SECRET_KEY_FROM_DASHBOARD> wording. Test-only placeholder, not a live key.
[[allowlists]]
description = "STRIPE_TEST_MODE_RUNBOOK.md historical sk_test_placeholder only"
paths = [
  '''(?:^|/)STRIPE_TEST_MODE_RUNBOOK\.md$''',
]
regexes = [
  '''^sk_test_placeholder$''',
]

# Commit-level allowlist for the same Stripe runbook placeholder revisions
# (defense in depth for full-history scans).
[[allowlists]]
description = "STRIPE_TEST_MODE_RUNBOOK.md historical Stripe placeholder commits"
commits = [
  "c9106d7ed6a19f792f913d087996b1a36e97ac53",
  "d4badf0d68b1c7ff348d87cd03c5c33401979b10",
]
